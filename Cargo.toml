[package]
name = "cmmt"
version = "0.1.0"
edition = "2021"
description = "Media Tools: ffmpeg front end for the file manager context menu"
license = "MIT"

[dependencies]
# The window is drawn by the program itself (OpenGL), so no GUI toolkit has to be installed.
# X11 / Wayland libraries are loaded at run time (dlopen), nothing is linked against them.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # tags in the order ffprobe gives them
toml = { version = "0.8", features = ["preserve_order"] }
raw-window-handle = "0.6"

# blur behind the window on KDE Wayland (talks to the compositor through the connection of the window)
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[profile.release]
strip = true
codegen-units = 4
panic = "abort"
