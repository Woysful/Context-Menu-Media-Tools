# ------------------------------------------------------------------ Convert Video
# One entry per output format: `text` is the name the window shows, `hint` a few words next to it,
# `default = true` preselects it.

[video_convert.mp4]
text = "MP4"
hint = "plays anywhere"
ext = "mp4"
default = true
command = 'ffmpeg -n -i {input} -c:v copy -c:a aac {output}'
output = "{base}.{ext}"

[video_convert.avi]
text = "AVI"
hint = "older players"
ext = "avi"
command = 'ffmpeg -n -i {input} -c:v mpeg4 -q:v 2 {output}'
output = "{base}.{ext}"

[video_convert.mov]
text = "MOV"
hint = "Apple, editing"
ext = "mov"
command = 'ffmpeg -n -i {input} -c:v copy {output}'
output = "{base}.{ext}"

[video_convert.mkv]
text = "MKV"
hint = "no re-encoding"
ext = "mkv"
command = 'ffmpeg -n -i {input} -c:v copy -c:a copy {output}'
output = "{base}.{ext}"

[video_convert.m4v]
text = "M4V"
hint = "Apple devices"
ext = "m4v"
command = 'ffmpeg -n -i {input} -c:v copy -c:a aac {output}'
output = "{base}.{ext}"

[video_convert.webm]
text = "WebM"
hint = "for the web, slow"
ext = "webm"
command = 'ffmpeg -n -i {input} -c:v libvpx-vp9 -c:a libopus {output}'
output = "{base}.{ext}"

# ------------------------------------------------------------------ Convert Audio (of a video)
# The video is copied, the audio tracks are re-encoded; the container of the source is kept
# (clip.mkv -> clip_audio_mp3.mkv).

[video_audio.wav]
text = "WAV"
hint = "lossless, large"
ext = "wav"
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a pcm_s16le {output}'
output = "{base}_audio_{fmt}.{srcext}"

[video_audio.mp3]
text = "MP3"
hint = "plays anywhere"
ext = "mp3"
default = true
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a mp3 -b:a 192k {output}'
output = "{base}_audio_{fmt}.{srcext}"

[video_audio.flac]
text = "FLAC"
hint = "lossless, smaller"
ext = "flac"
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a flac {output}'
output = "{base}_audio_{fmt}.{srcext}"

[video_audio.aac]
text = "AAC"
hint = "small, good"
ext = "aac"
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a aac -b:a 192k {output}'
output = "{base}_audio_{fmt}.{srcext}"

[video_audio.ogg]
text = "OGG"
hint = "open format"
ext = "ogg"
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a libvorbis -q:a 0 {output}'
output = "{base}_audio_{fmt}.{srcext}"

[video_audio.wma]
text = "WMA"
hint = "Windows"
ext = "wma"
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a wmav2 -b:a 192k {output}'
output = "{base}_audio_{fmt}.{srcext}"

[video_audio.m4a]
text = "M4A"
hint = "Apple, AAC"
ext = "m4a"
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a aac -b:a 192k {output}'
output = "{base}_audio_{fmt}.{srcext}"

[video_audio.opus]
text = "Opus"
hint = "best when small"
ext = "opus"
command = 'ffmpeg -n -i {input} -map 0:v -c:v copy -map 0:a -c:a libopus -q:a 0 {output}'
output = "{base}_audio_{fmt}.{srcext}"

# ------------------------------------------------------------------ Extract Audio

[extract.mp3]
text = "MP3"
hint = "plays anywhere"
ext = "mp3"
default = true
command = 'ffmpeg -n -i {input} -vn -q:a 0 {output}'
output = "{base}.{ext}"

[extract.aac]
text = "AAC"
hint = "copied as it is"
ext = "aac"
command = 'ffmpeg -n -i {input} -vn -c copy {output}'
output = "{base}.{ext}"

[extract.opus]
text = "Opus"
hint = "small, good"
ext = "opus"
command = 'ffmpeg -n -i {input} -vn -c:a libopus -q:a 0 -vbr on {output}'
output = "{base}.{ext}"

[extract.wav]
text = "WAV"
hint = "lossless, large"
ext = "wav"
command = 'ffmpeg -n -i {input} -vn -q:a 0 {output}'
output = "{base}.{ext}"

[extract.m4a]
text = "M4A"
hint = "Apple, AAC"
ext = "m4a"
command = 'ffmpeg -n -i {input} -vn -q:a 0 -map a -map_metadata 0 {output}'
output = "{base}.{ext}"

[extract.mka]
text = "MKA"
hint = "copied as it is"
ext = "mka"
command = 'ffmpeg -n -i {input} -vn -c:a copy -map a -map_metadata 0 {output}'
output = "{base}.{ext}"

# ------------------------------------------------------------------ Make frame sequence
# The frames go into a folder named like the video ({base}); an existing folder is never reused.

[frames.png]
text = "PNG"
hint = "lossless"
ext = "png"
default = true
command = 'ffmpeg -n -i {input} {output}'
output = "{base}/frame_%06d.{ext}"

[frames.jpg]
text = "JPG"
hint = "small files"
ext = "jpg"
command = 'ffmpeg -n -i {input} -q:v 1 {output}'
output = "{base}/frame_%06d.{ext}"

[frames.webp]
text = "WebP"
hint = "small, with alpha"
ext = "webp"
command = 'ffmpeg -n -i {input} -c:v libwebp -q:v 95 -pix_fmt yuva420p {output}'
output = "{base}/frame_%06d.{ext}"

