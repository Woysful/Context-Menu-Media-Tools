output = "{base}_limit_{mb}MB_av1gpu.mp4"
rc_max = 145
rc_buf = 200
aim = 98.0
bpp_min = 0.05
chunked = true

[limit.h264_amd]
label = "H.264"
group = "amd"
backend = "vaapi"
