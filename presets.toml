text = "M4A"
hint = "Apple, AAC"
ext = "m4a"
command = 'ffmpeg -n -i {input} -c:a aac -b:a 192k {output}'
output = "{base}.{ext}"

[audio_file.opus]
text = "Opus"
hint = "best when small"
ext = "opus"
command = 'ffmpeg -n -i {input} -q:a 0 -c:a libopus {output}'
output = "{base}.{ext}"

# ------------------------------------------------------------------ Convert Image

[image.jpg]
text = "JPG"
hint = "photos, small"
ext = "jpg"
default = true
command = 'ffmpeg -n -i {input} -q:v 5 {output}'
output = "{base}.{ext}"

[image.png]
text = "PNG"
hint = "lossless, alpha"
ext = "png"
command = 'ffmpeg -n -i {input} {output}'
output = "{base}.{ext}"

[image.bmp]
text = "BMP"
hint = "uncompressed"
ext = "bmp"
command = 'ffmpeg -n -i {input} {output}'
output = "{base}.{ext}"

[image.tiff]
text = "TIFF"
hint = "print, lossless"
ext = "tiff"
command = 'ffmpeg -n -i {input} {output}'
output = "{base}.{ext}"

[image.gif]
text = "GIF"
hint = "256 colours"
ext = "gif"
command = 'ffmpeg -n -i {input} -f gif {output}'
output = "{base}.{ext}"

[image.webp]
text = "WebP"
hint = "web, small"
ext = "webp"
command = 'ffmpeg -n -i {input} -c:v libwebp -q:v 95 {output}'
output = "{base}.{ext}"

[image.tga]
text = "TGA"
hint = "games, textures"
ext = "tga"
command = 'ffmpeg -n -i {input} {output}'
output = "{base}.{ext}"

# ------------------------------------------------------------------ Delete sound

[delete_sound]
command = 'ffmpeg -n -i {input} -an -c copy {output}'
output = "{base} (no audio).{srcext}"

# ------------------------------------------------------------------ Convert to WebP animation
# size / fps / quality / compression preselect the dialog. {size} limits the SHORTER side of the picture.

[webp_anim]
size = 720
fps = 20
quality = 80
compression = 5
command = '''ffmpeg -n -i {input} -an -vf "fps={fps},scale=w='if(gt(iw,ih),-2,min(iw,{size}))':h='if(gt(iw,ih),min(ih,{size}),-2)':flags=lanczos" -c:v libwebp -quality {quality} -compression_level {compression} -loop 0 {output}'''
output = "{base}.webp"
