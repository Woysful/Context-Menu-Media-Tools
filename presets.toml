# =============================================================================
#  cmmt presets - the complete ffmpeg command of every function of the program.
#
#  This file is the built-in copy. `cmmt config --init` writes it to your own file:
#      Linux:    ~/.config/cmmt/presets.toml
#      Windows:  %APPDATA%\cmmt\presets.toml
#  Edit the commands there; a change applies at the next launch. A function that
#  is missing from your file (or a whole new program version with new presets) is taken
#  from the built-in copy, so the file may also contain only the entries you changed.
#
#  A `command` is a normal ffmpeg command line (quotes work like in a shell). The program
#  fills the placeholders:
#
#      {input}   the file; {output}  the result (named by `output`, never overwrites a file)
#      {vf}      "-vf <filters>" for the chosen resolution, or nothing
#      {scale}   the same filters as a prefix with a trailing comma, for your own -vf chain
#      {q} {p}   values of the compression level (low / medium / high) of the entry
#      {render_node}   the GPU device of AMD / Intel (VAAPI)
#      size limit mode only:
#      {rate}    -b:v -maxrate -bufsize (computed from the limit)   {pass}   two-pass options
#      {audio}   audio options (or -an)   {seek}   -ss / -t of a chunk   {overwrite}   -n or -y
#      {fps} {quality} {compression} {size}      WebP animation
#
#  `output` is the name of the result: {base} = path of the file without extension,
#  {name} = its name, {dir} = its folder, {srcext} = its extension, {ext} = extension
#  of the chosen format, {fmt} = key of the format, {mb} = the size limit.
#  Other keys: label (what the drop-down shows), group, backend, q / p, rc_max, rc_buf,
#  aim, bpp_min, twopass, chunked - see README.md.
#  An entry can have [entry.windows] / [entry.linux] sub-tables that override it on
#  that system only (used for the AMD / Intel GPUs: VAAPI on Linux, AMF / QSV on Windows).
# =============================================================================

# ------------------------------------------------------------------ Compress Video: presets
# group: cpu | nvidia | amd | intel | pi     backend: cpu | nvenc | vaapi | amf | qsv | v4l2m2m

[compress.h264_cpu]
label = "H.264"
group = "cpu"
backend = "cpu"
command = 'ffmpeg -n -i {input} {vf} -pix_fmt yuv420p -c:v libx264 -profile:v main -crf {q} {output}'
output = "{base}_compressed.mp4"
q = [22, 30, 35]

[compress.h265_cpu]
label = "HEVC"
group = "cpu"
backend = "cpu"
command = 'ffmpeg -n -i {input} {vf} -pix_fmt yuv420p -c:v libx265 -profile:v main -crf {q} -tag:v hvc1 {output}'
output = "{base}_compressed.mp4"
q = [22, 30, 35]

[compress.av1_cpu_fast]
label = "AV1 Fast"
group = "cpu"
backend = "cpu"
command = 'ffmpeg -n -i {input} {vf} -c:v libsvtav1 -preset {p} -rc vbr -crf {q} {output}'
output = "{base}_compressed.mp4"
q = [32, 44, 55]
p = [7, 7, 5]

[compress.av1_cpu_slow]
label = "AV1 Slow"
group = "cpu"
backend = "cpu"
command = 'ffmpeg -n -i {input} {vf} -c:v libsvtav1 -preset {p} -rc vbr -crf {q} {output}'
output = "{base}_compressed.mp4"
q = [32, 44, 55]
p = [5, 5, 4]

[compress.h264_nv]
label = "H.264"
group = "nvidia"
backend = "nvenc"
command = 'ffmpeg -n -hwaccel cuda -hwaccel_output_format cuda -i {input} {vf} -c:v h264_nvenc -profile:v main -cq {q} -preset p7 {output}'
output = "{base}_compressed.mp4"
q = [29, 37, 41]

[compress.h265_nv]
label = "HEVC"
group = "nvidia"
backend = "nvenc"
command = 'ffmpeg -n -hwaccel cuda -hwaccel_output_format cuda -i {input} {vf} -c:v hevc_nvenc -profile:v main -cq {q} -preset p7 -tag:v hvc1 {output}'
output = "{base}_compressed.mp4"
q = [28, 37, 43]

[compress.av1_nv]
label = "AV1"
group = "nvidia"
backend = "nvenc"
command = 'ffmpeg -n -hwaccel cuda -hwaccel_output_format cuda -i {input} {vf} -c:v av1_nvenc -cq {q} -preset p7 {output}'
output = "{base}_compressed.mp4"
q = [37, 47, 56]

[compress.h264_amd]
label = "H.264"
group = "amd"
backend = "vaapi"
vendor = "amd"
command = 'ffmpeg -n -vaapi_device {render_node} -i {input} -vf "{scale}format=nv12,hwupload" -c:v h264_vaapi -profile:v main -global_quality {q} {output}'
output = "{base}_compressed.mp4"
q = [29, 37, 41]
[compress.h264_amd.windows]
backend = "amf"
command = 'ffmpeg -n -i {input} {vf} -c:v h264_amf -quality quality -rc cqp -qp_i {q} -qp_p {q} -qp_b {q} {output}'

[compress.h265_amd]
label = "HEVC"
group = "amd"
backend = "vaapi"
vendor = "amd"
command = 'ffmpeg -n -vaapi_device {render_node} -i {input} -vf "{scale}format=nv12,hwupload" -c:v hevc_vaapi -profile:v main -global_quality {q} -tag:v hvc1 {output}'
output = "{base}_compressed.mp4"
q = [28, 37, 43]
[compress.h265_amd.windows]
backend = "amf"
command = 'ffmpeg -n -i {input} {vf} -c:v hevc_amf -quality quality -rc cqp -qp_i {q} -qp_p {q} -tag:v hvc1 {output}'

[compress.av1_amd]
label = "AV1"
group = "amd"
backend = "vaapi"
vendor = "amd"
command = 'ffmpeg -n -vaapi_device {render_node} -i {input} -vf "{scale}format=nv12,hwupload" -c:v av1_vaapi -global_quality {q} {output}'
output = "{base}_compressed.mp4"
q = [37, 47, 56]
[compress.av1_amd.windows]
backend = "amf"
command = 'ffmpeg -n -i {input} {vf} -c:v av1_amf -quality quality -rc cqp -qp_i {q} -qp_p {q} {output}'

[compress.h264_intel]
label = "H.264"
group = "intel"
backend = "vaapi"
vendor = "intel"
command = 'ffmpeg -n -vaapi_device {render_node} -i {input} -vf "{scale}format=nv12,hwupload" -c:v h264_vaapi -profile:v main -global_quality {q} {output}'
output = "{base}_compressed.mp4"
q = [29, 37, 41]
[compress.h264_intel.windows]
backend = "qsv"
command = 'ffmpeg -n -i {input} {vf} -c:v h264_qsv -profile:v main -preset slower -global_quality {q} {output}'

[compress.h265_intel]
label = "HEVC"
group = "intel"
backend = "vaapi"
vendor = "intel"
command = 'ffmpeg -n -vaapi_device {render_node} -i {input} -vf "{scale}format=nv12,hwupload" -c:v hevc_vaapi -profile:v main -global_quality {q} -tag:v hvc1 {output}'
output = "{base}_compressed.mp4"
q = [28, 37, 43]
[compress.h265_intel.windows]
backend = "qsv"
command = 'ffmpeg -n -i {input} {vf} -c:v hevc_qsv -preset slower -global_quality {q} -tag:v hvc1 {output}'

[compress.av1_intel]
label = "AV1"
group = "intel"
backend = "vaapi"
vendor = "intel"
command = 'ffmpeg -n -vaapi_device {render_node} -i {input} -vf "{scale}format=nv12,hwupload" -c:v av1_vaapi -global_quality {q} {output}'
output = "{base}_compressed.mp4"
q = [37, 47, 56]
[compress.av1_intel.windows]
backend = "qsv"
command = 'ffmpeg -n -i {input} {vf} -c:v av1_qsv -preset slower -global_quality {q} {output}'

[compress.h264_pi]
label = "H.264"
group = "pi"
backend = "v4l2m2m"
command = 'ffmpeg -n -i {input} {vf} -pix_fmt yuv420p -c:v h264_v4l2m2m -b:v {q} {output}'
output = "{base}_compressed.mp4"
q = ["8M", "4M", "2M"]

# The hardware encoder of the Raspberry Pi 3 / 4 has no quality mode, so the levels are bitrates.
# (a Raspberry Pi 5 has no hardware video encoder: use the CPU codecs there)

# ------------------------------------------------------------------ Compress Video: size limit
# The bitrate is computed from the size limit and given to the command as {rate}. Parameters:
#   rc_max / rc_buf  maxrate / bufsize as % of the target bitrate
#   aim              % of the limit that is really aimed at (reserve against rate-control error)
#   bpp_min          bits per pixel below which "Auto" resolution scales the picture down
#   twopass          "x264" | "x265" = the entry supports the two-pass option ({pass})
#   chunked          true = hardware encoders: encoded in chunks with feedback so the size is exact
#                    (the same command is run once per chunk, with {seek} and {overwrite} filled in)
# Presets (preset = true) are listed after the codecs; `inherit` copies another entry.

[limit.discord]
preset = true
label = "Discord · HEVC CPU"
inherit = "h265_cpu"
limit = 20
output = "{base}_discord.mp4"

[limit.h264_cpu]
label = "H.264"
group = "cpu"
backend = "cpu"
command = 'ffmpeg {overwrite} {seek} -i {input} {vf} -c:v libx264 -profile:v main -pix_fmt yuv420p -preset medium {rate} {pass} {audio} {output}'
output = "{base}_limit_{mb}MB_h264cpu.mp4"
rc_max = 200
rc_buf = 600
aim = 99.0
bpp_min = 0.07
twopass = "x264"

[limit.h265_cpu]
label = "HEVC"
group = "cpu"
backend = "cpu"
command = 'ffmpeg {overwrite} {seek} -i {input} {vf} -c:v libx265 -profile:v main -pix_fmt yuv420p -preset medium -tag:v hvc1 {rate} {pass} {audio} {output}'
output = "{base}_limit_{mb}MB_hevccpu.mp4"
rc_max = 200
rc_buf = 600
aim = 98.5
bpp_min = 0.05
twopass = "x265"

[limit.av1_cpu]
label = "AV1"
group = "cpu"
backend = "cpu"
command = 'ffmpeg {overwrite} {seek} -i {input} {vf} -c:v libsvtav1 -preset 6 -pix_fmt yuv420p {rate} {pass} {audio} {output}'
output = "{base}_limit_{mb}MB_av1cpu.mp4"
rc_max = 145
rc_buf = 200
aim = 96.0
bpp_min = 0.05

[limit.h264_nv]
label = "H.264"
group = "nvidia"
backend = "nvenc"
command = 'ffmpeg {overwrite} -hwaccel cuda -hwaccel_output_format cuda {seek} -i {input} {vf} -c:v h264_nvenc -profile:v main -preset p7 -rc:v vbr {rate} {pass} {audio} {output}'
output = "{base}_limit_{mb}MB_h264gpu.mp4"
rc_max = 145
rc_buf = 200
aim = 98.0
bpp_min = 0.07
chunked = true

[limit.h265_nv]
label = "HEVC"
group = "nvidia"
backend = "nvenc"
command = 'ffmpeg {overwrite} -hwaccel cuda -hwaccel_output_format cuda {seek} -i {input} {vf} -c:v hevc_nvenc -profile:v main -preset p7 -rc:v vbr -tag:v hvc1 {rate} {pass} {audio} {output}'
output = "{base}_limit_{mb}MB_hevcgpu.mp4"
rc_max = 145
rc_buf = 200
aim = 98.0
bpp_min = 0.05
chunked = true

[limit.av1_nv]
